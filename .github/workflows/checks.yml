name: Checks
on:
  pull_request:
  push:
    branches: [main, 'fix/**']
permissions:
  contents: read
jobs:
  migration:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile "TroveModMigration Tool.py"
  dashboard:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test profiles and dashboard with isolated fake client
        shell: pwsh
        run: ./tests/windows-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-windows
          path: |
            dashboard-windows.png
            tests/keys.log
          if-no-files-found: ignore
